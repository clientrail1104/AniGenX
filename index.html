 async function encodeWatchable(item, preferredFormat){
  if(!item.src || !item.src.startsWith("data:image/")) throw new Error("This gallery item has no source image. Generate a new master first.");

  const img=new Image();
  img.decoding="async";
  img.src=item.src;
  await new Promise((resolve,reject)=>{
    img.onload=resolve;
    img.onerror=()=>reject(new Error("The source image cannot be decoded by this browser. Try PNG/JPG/WebP."));
  });

  const w=resolution==="8K"?1920:resolution==="4K"?1280:960;
  const hgt=Math.round(w*9/16);
  const canvas=document.createElement("canvas");
  canvas.width=w; canvas.height=hgt;
  const ctx=canvas.getContext("2d",{alpha:false});
  if(!ctx || !canvas.captureStream) throw new Error("This browser cannot create a video stream.");

  const stream=canvas.captureStream(30);
  const candidates = preferredFormat==="mp4"
    ? ["video/mp4;codecs=avc1.42E01E","video/mp4"]
    : ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];

  const mime=candidates.find(x=>window.MediaRecorder && MediaRecorder.isTypeSupported(x));
  if(!mime) return null; // caller will use FFmpeg server

  const rec=new MediaRecorder(stream,{
    mimeType:mime,
    videoBitsPerSecond:exportQuality==="Extreme"?12000000:exportQuality==="High"?7000000:3500000
  });

  const chunks=[];
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const stopped=new Promise((resolve,reject)=>{
    rec.onstop=resolve;
    rec.onerror=e=>reject(e.error||new Error("Browser video recorder failed."));
  });
  rec.start(200);

  const seconds=Math.max(1,Number(item.duration)||1);
  const frames=Math.max(30,Math.round(seconds*30));
  let frame=0;
  const motionText=((item.prompt||prompt||"")+" "+selectedPaths.join(" ")).toLowerCase();

  const draw=()=>{
    const t=frame/Math.max(1,frames-1);
    const ease=.5-Math.cos(t*Math.PI)/2;
    const zoom=1+.055*ease+(motionText.includes("zoom")?0.055*ease:0);
    const pan=Math.sin(t*Math.PI*2)*(.025+(motionText.includes("pan")||motionText.includes("orbit")?.055:0));
    const vertical=Math.cos(t*Math.PI*2)*(.018+(motionText.includes("tilt")?.035:0));

    const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
    const scale=Math.max(w*zoom/iw,hgt*zoom/ih);
    const dw=iw*scale, dh=ih*scale;
    ctx.fillStyle="#050507"; ctx.fillRect(0,0,w,hgt);
    ctx.drawImage(img,(w-dw)/2+pan*w,(hgt-dh)/2+vertical*hgt,dw,dh);

    const vg=ctx.createRadialGradient(w/2,hgt/2,Math.min(w,hgt)*.15,w/2,hgt/2,Math.max(w,hgt)*.7);
    vg.addColorStop(0,"rgba(0,0,0,0)");
    vg.addColorStop(1,"rgba(0,0,0,.42)");
    ctx.fillStyle=vg;ctx.fillRect(0,0,w,hgt);

    frame++;
    if(frame<frames) requestAnimationFrame(draw);
    else setTimeout(()=>rec.stop(),220);
  };
  draw();
  await stopped;
  if(!chunks.length) throw new Error("The browser produced an empty video.");
  return {
    blob:new Blob(chunks,{type:mime}),
    mime,
    ext:mime.startsWith("video/mp4")?"mp4":"webm"
  };
 }

 async function requestTranscode(sourceBlob, sourceName, targetFormat){
   const fd=new FormData();
   fd.append("video",sourceBlob,sourceName);
   fd.append("format",targetFormat);
   fd.append("quality",exportQuality);
   fd.append("filename",(exportItem.title||"vanta-master"));
   fd.append("duration",String(exportItem.duration));

   let response;
   try{
     response=await fetch("/api/transcode",{method:"POST",body:fd});
   }catch(e){
     throw new Error("FFmpeg server is not connected. Start the VANTA transcoder server before exporting this format.");
   }
   if(!response.ok){
     let detail="";
     try{const j=await response.json();detail=j.error||""}catch(_){}
     throw new Error(detail||"FFmpeg transcoding failed.");
   }
   return await response.blob();
 }
